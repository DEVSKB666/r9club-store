services:
  mysql:
    image: mysql:8.0
    container_name: r9club-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: r9club_music
      MYSQL_USER: r9club
      MYSQL_PASSWORD: r9club_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin
    container_name: r9club-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: r9club
      PMA_PASSWORD: r9club_password

volumes:
  mysql_data: